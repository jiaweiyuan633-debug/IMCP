[project]
name = "ai-service"
version = "0.1.0"
description = "FastAPI AI service for admin scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
]

# 批次3（R4-1.49）：文档解析依赖以 extra 声明——基础镜像不含解析库（控制镜像体积与
# 攻击面），需要 pdf/docx/xlsx 解析的生产镜像用 `uv sync --extra parsing` 安装
# （Dockerfile 同步；OCR 依赖 tesseract 走系统 apt 层，见 Dockerfile）
[project.optional-dependencies]
parsing = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "fakeredis>=2.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# 批次3（R4-1.49）：覆盖率门禁——此前测试可随删随过；线覆盖低于 60% 即失败，
# 门槛随测试补齐逐步上调（当前以既有 19 个测试文件为基线）
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 100
target-version = "py311"
