name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: mvn -q verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint
      - name: Frontend tests (with coverage gate)
        working-directory: frontend
        run: pnpm exec vitest run --coverage
      - name: Frontend build
        working-directory: frontend
        run: pnpm build

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: AI tests (with coverage gate)
        working-directory: ai-service
        # --locked 防锁文件漂移；pytest 覆盖率门禁由 pyproject addopts 生效
        run: uv run pytest -q --locked
      - name: AI lint
        working-directory: ai-service
        run: uv run ruff check .

  website:
    # website 与 frontend 同为 pnpm 项目（pnpm-lock.yaml），此前用 npm install 安装会
    # 绕过 pnpm 依赖解析导致锁文件与解析结果漂移；改为与 frontend job 一致的 pnpm 安装
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Website build
        working-directory: website
        run: pnpm build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        with:
          # 显式 fail——该 action 默认只出报告不失败，密钥门禁形同虚设
          fail: true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: HIGH,CRITICAL

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java,javascript,python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  e2e:
    # Playwright E2E 冒烟：docker compose 起 mysql/redis/backend/
    # ai-service/frontend/website 全栈，跑 admin 登录→看板 与 官网预约两条链路。
    # backend 无 healthcheck，--wait 只等 mysql/redis healthy，故额外轮询登录配置接口
    # 确认应用就绪（Flyway 迁移完成）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install E2E dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      # Playwright 运行时转译 TS 但不做类型检查；tsconfig 为 strict 无 typecheck script 时
      # 类型错误不会被 CI 捕获，故在起栈前显式跑 tsc --noEmit 作为门禁
      - name: E2E typecheck
        working-directory: e2e
        run: pnpm run typecheck
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 360
      - name: Wait for backend API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/auth/login-config >/dev/null 2>&1; then
              echo "backend ready"
              exit 0
            fi
            sleep 5
          done
          echo "backend not ready in time; dumping logs:"
          docker compose logs backend mysql --tail 100
          exit 1
      - name: Run E2E tests
        working-directory: e2e
        run: ADMIN_URL=http://localhost:8088 WEBSITE_URL=http://localhost:8081 pnpm exec playwright test

  docker-build:
    # 构建并（配置了 DOCKER_REGISTRY 时）推送四端镜像。
    # 注意：GitHub Actions 的 secrets 上下文不能直接用于 step 级 if 判断，
    # 需先在 job 级 env 解析（secrets 可用于 job 级 env），登录/推送再按 env 门控，
    # 避免登录步骤被静默跳过。未配置 registry（fork / 本地仓库）时仅构建不推送。
    # 镜像 tag 使用不可变 commit sha；配置 registry 时追加 latest。
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service, website]
    env:
      REGISTRY_ENABLED: ${{ secrets.DOCKER_REGISTRY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to container registry
        if: env.REGISTRY_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ env.REGISTRY_ENABLED == 'true' }}
          tags: ${{ env.REGISTRY_ENABLED == 'true' && format('{0}/admin-backend:{1},{0}/admin-backend:latest', secrets.DOCKER_REGISTRY, github.sha) || format('admin-backend:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push ai-service image
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: ${{ env.REGISTRY_ENABLED == 'true' }}
          tags: ${{ env.REGISTRY_ENABLED == 'true' && format('{0}/ai-service:{1},{0}/ai-service:latest', secrets.DOCKER_REGISTRY, github.sha) || format('ai-service:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ env.REGISTRY_ENABLED == 'true' }}
          tags: ${{ env.REGISTRY_ENABLED == 'true' && format('{0}/admin-frontend:{1},{0}/admin-frontend:latest', secrets.DOCKER_REGISTRY, github.sha) || format('admin-frontend:{0}', github.sha) }}
          # VITE_API_BASE_URL 由 secret 注入；未配置时为空 → 构建走同源 /api 反代
          build-args: VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push website image
        uses: docker/build-push-action@v6
        with:
          context: website
          push: ${{ env.REGISTRY_ENABLED == 'true' }}
          tags: ${{ env.REGISTRY_ENABLED == 'true' && format('{0}/website:{1},{0}/website:latest', secrets.DOCKER_REGISTRY, github.sha) || format('website:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  crud-gen:
    # CRUD 生成器自带单测：防止生成模板/包路径变更静默破坏"新增业务模块"链路
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CRUD generator tests
        working-directory: scripts/crud-gen
        run: python -m unittest discover -s tests -v
