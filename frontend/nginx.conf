# 非 root nginx 监听 8080（容器端口与 k8s containerPort 一致）
# /api 由 Ingress 直接转发到后端，不在此处二次代理
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 安全响应头（纵深）：点击劫持/MIME 嗅探/信息泄漏/iframe 与对象加载收紧
    # - CSP：API/WS 均同源（/api、/ws 由 Ingress 反代），connect-src 'self' 即可；
    #   若未来启用跨源 API 或第三方上报，需在此追加对应域名。style-src 保留
    #   'unsafe-inline'（antd cssinjs / Vue 运行时注入的内联 <style> 依赖）。
    # - HSTS 无条件下发：TLS 在网关/Ingress 终结，浏览器只在 https 响应采纳该头，
    #   直连 http 时按规范忽略，故无需 $https 分支。
    # 注意：nginx add_header 不跨层继承——凡自带 add_header 的 location（/index.html、
    # /sw.js、静态资源）必须重复整组头，否则这些响应的安全头会丢失。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /favicon.ico：浏览器未配置图标链接时的自动请求，返回 SVG 图标避免 404
    location = /favicon.ico {
        default_type image/svg+xml;
        try_files /favicon.svg =404;
    }

    # index.html 与 sw.js 不缓存：浏览器启发式缓存可能复用旧壳，
    # 配合 PWA 发版拿旧版本（旧前端调用已下线接口）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存（自带 add_header，重复 server 层安全头）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
}
