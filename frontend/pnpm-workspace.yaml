onlyBuiltDependencies:
  - core-js
  - esbuild
  - vue-demi

confirmModulesPurge: false

allowBuilds:
  core-js: true
  esbuild: true
  vue-demi: true

# pnpm 11 起 overrides 不再读 package.json 的 "pnpm" 字段，须放 pnpm-workspace.yaml。
# nanoid 3.3.17（postcss 传递依赖）存在 CVE-2026-67213，3.3.18 修复；override 使 lockfile
# 整体解析到 3.3.18（postcss 8.5 依赖 ^3.3.6，3.3.18 在其允许范围内）。
overrides:
  nanoid: ^3.3.18
