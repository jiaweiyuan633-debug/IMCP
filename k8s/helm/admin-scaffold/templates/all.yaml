      app: {{ .Release.Name }}-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ai
