{{- /* 密钥治理：缺省/空值即终止渲染（fail-fast），杜绝明文默认密钥上生产 */ -}}
{{- if or (not .Values.secret.dbPassword) (not .Values.secret.jwtSecret) (not .Values.secret.totpEncryptionKey) (not .Values.secret.aiAuthToken) (not .Values.secret.mcpAuthToken) }}
{{ fail "secret.dbPassword / secret.jwtSecret / secret.totpEncryptionKey / secret.aiAuthToken / secret.mcpAuthToken 必须通过 --set 显式注入（例如 --set secret.dbPassword=xxx --set secret.jwtSecret=xxx --set secret.totpEncryptionKey=xxx --set secret.aiAuthToken=xxx --set secret.mcpAuthToken=xxx）" }}
{{- end }}
{{- /*
    内部服务主机名：values.config.{callbackBaseUrl,aiBaseUrl,frontendUrl} 留空时按
    .Release.Name 推导（{release}-backend / -ai / -frontend），与下方各 Service
    命名保持一致。values.yaml 不再硬编码 admin-* 默认值，避免非默认 release 名下回调/出站
    AI/前端地址漂移指向不存在的服务（R4-1.45）。
*/ -}}
{{- $callbackBaseUrl := .Values.config.callbackBaseUrl | default (printf "http://%s-backend:8080" .Release.Name) -}}
{{- $aiBaseUrl := .Values.config.aiBaseUrl | default (printf "http://%s-ai:8000" .Release.Name) -}}
{{- $frontendUrl := .Values.config.frontendUrl | default (printf "http://%s-frontend:8080" .Release.Name) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  DB_HOST: {{ .Values.config.dbHost }}
  DB_PORT: {{ .Values.config.dbPort }}
  DB_NAME: {{ .Values.config.dbName }}
  DB_USERNAME: {{ .Values.config.dbUser }}
  REDIS_HOST: {{ .Values.config.redisHost }}
  REDIS_PORT: {{ .Values.config.redisPort }}
  REDIS_URL: {{ .Values.config.redisUrl }}
  CALLBACK_BASE_URL: {{ $callbackBaseUrl }}
  # AI 回调 SSRF 防护白名单：由 callbackBaseUrl 推导（避免手工同步漂移）。
  # AI 服务出站任务回调仅允许打回后端回调 origin；如需多 origin 改此模板为静态 JSON 数组。
  CALLBACK_ALLOWED_ORIGINS: {{ list $callbackBaseUrl | toJson | quote }}
  AI_BASE_URL: {{ $aiBaseUrl }}
{{- if .Values.config.milvusEnabled }}
  # RAG 向量检索（可选）：Milvus 接入，需先部署 k8s/milvus
  MILVUS_ENABLED: "true"
  MILVUS_HOST: {{ .Values.config.milvusHost }}
  MILVUS_PORT: {{ .Values.config.milvusPort }}
  MILVUS_DATABASE: {{ .Values.config.milvusDatabase }}
  MILVUS_EMBEDDING_ENDPOINT: {{ .Values.config.milvusEmbeddingEndpoint }}
  MILVUS_EMBEDDING_API_KEY: {{ .Values.config.milvusEmbeddingApiKey }}
  MILVUS_EMBEDDING_MODEL: {{ .Values.config.milvusEmbeddingModel }}
{{- end }}
  # 生产配置层必需项：缺失会导致后端启动失败（fail-fast）
  FRONTEND_URL: {{ $frontendUrl }}
  CORS_ALLOWED_ORIGIN_PATTERNS: {{ .Values.config.corsAllowedOriginPatterns }}
  # 上传持久化挂载点：本地存储 root + /uploads 静态资源根（P2-15 高可用）
  UPLOAD_PATH: {{ .Values.storage.uploadPath }}
{{- if .Values.config.redisSentinelMaster }}
  # Redis 主从哨兵（可选）：仅当 master 非空时注入，避免空值误激活后端哨兵段（application-prod.yml on-property）
  REDIS_SENTINEL_MASTER: {{ .Values.config.redisSentinelMaster }}
  REDIS_SENTINEL_NODES: {{ .Values.config.redisSentinelNodes }}
  REDIS_SENTINEL_PASSWORD: {{ .Values.config.redisSentinelPassword }}
{{- end }}
  # 链路追踪（可选）：配置了端点才启用；留空显式关闭 tracing，避免空 endpoint 下
  # Sender/AsyncZipkinSpanHandler 仍被实例化、每次 flush 构造非法 URI 失败丢 span
  # （management.tracing.enabled=false 使 spanHandler 不注册，application.yml 同名属性）
  MANAGEMENT_TRACING_ENABLED: {{ if .Values.config.zipkinEndpoint }}true{{ else }}false{{ end }}
  {{- if .Values.config.zipkinEndpoint }}
  # Zipkin 上报端点，与 MANAGEMENT_TRACING_ENABLED 配套（application.yml management.zipkin.tracing.endpoint）
  ZIPKIN_ENDPOINT: {{ .Values.config.zipkinEndpoint }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secret.dbPassword }}
  JWT_SECRET: {{ .Values.secret.jwtSecret }}
  TOTP_ENCRYPTION_KEY: {{ .Values.secret.totpEncryptionKey }}
  AUTH_TOKEN: {{ .Values.secret.aiAuthToken }}
  MCP_AUTH_TOKEN: {{ .Values.secret.mcpAuthToken }}
{{- if .Values.storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-upload
spec:
  accessModes:
    - {{ .Values.storage.accessMode }}
  {{- with .Values.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.replicas.backend }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      automountServiceAccountToken: false
      # 优雅停机宽限期 > 后端 prod 关闭超时（30s），排空在途请求再销毁
      terminationGracePeriodSeconds: {{ .Values.storage.terminationGracePeriodSeconds }}
      # 多副本打散到不同节点，避免单节点故障拖垮全部实例（P2-15 高可用）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-backend
      {{- if .Values.storage.enabled }}
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-upload
      {{- end }}
      containers:
        - name: backend
          image: {{ .Values.images.backend }}
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.backend | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          {{- if .Values.storage.enabled }}
          volumeMounts:
            - name: upload
              mountPath: {{ .Values.storage.uploadPath }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          env:
            - name: SPRING_PROFILES_ACTIVE
              # 强制生产配置层：加载 application-prod.yml，JwtProperties/TotpService
              # 在非 dev 下拒绝开发默认密钥，未注入密钥直接启动失败
              value: "prod"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ai
spec:
  replicas: {{ .Values.replicas.ai }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ai
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ai
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.storage.terminationGracePeriodSeconds }}
      # 多副本打散到不同节点（P2-15 高可用）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-ai
      containers:
        - name: ai
          image: {{ .Values.images.ai }}
          ports:
            - containerPort: 8000
          securityContext:
            {{- toYaml .Values.securityContext.ai | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.ai | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.frontend | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-website
spec:
  replicas: {{ .Values.replicas.website }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-website
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-website
    spec:
      automountServiceAccountToken: false
      containers:
        - name: website
          image: {{ .Values.images.website }}
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.website | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.website | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ai
spec:
  selector:
    app: {{ .Release.Name }}-ai
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  selector:
    app: {{ .Release.Name }}-frontend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-website
spec:
  selector:
    app: {{ .Release.Name }}-website
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
            type: Utilization
            averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-ai
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-website
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-website
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ai
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-website
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-website
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API/SSE 直达后端，避免经前端 nginx 二次转发
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: 8080
          # 文件内容（inline 预览，contentUrl=/files/xxx）同源直达后端
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: 8080
          # 历史 /uploads/ 文件地址（R3-1.2 令牌化改造前的存量 URL，CommonController.isAccessiblePath
          # 仍为其签发令牌）同源直达后端，FileAccessFilter 仍校验令牌。此前缺失导致存量文件/头像
          # 在 K8s 落入 SPA 回退返回 index.html（R4-1.42 与批14 docker nginx 补 /files 对齐）
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: 8080

