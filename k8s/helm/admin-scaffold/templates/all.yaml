{{- /* 密钥治理：缺省/空值即终止渲染（fail-fast），杜绝明文默认密钥上生产 */ -}}
{{- if or (not .Values.secret.dbPassword) (not .Values.secret.jwtSecret) (not .Values.secret.totpEncryptionKey) (not .Values.secret.aiAuthToken) (not .Values.secret.mcpAuthToken) }}
{{ fail "secret.dbPassword / secret.jwtSecret / secret.totpEncryptionKey / secret.aiAuthToken / secret.mcpAuthToken 必须通过 --set 显式注入（例如 --set secret.dbPassword=xxx --set secret.jwtSecret=xxx --set secret.totpEncryptionKey=xxx --set secret.aiAuthToken=xxx --set secret.mcpAuthToken=xxx）" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  DB_HOST: {{ .Values.config.dbHost }}
  DB_PORT: {{ .Values.config.dbPort }}
  DB_NAME: {{ .Values.config.dbName }}
  DB_USERNAME: {{ .Values.config.dbUser }}
  REDIS_HOST: {{ .Values.config.redisHost }}
  REDIS_PORT: {{ .Values.config.redisPort }}
  REDIS_URL: {{ .Values.config.redisUrl }}
  CALLBACK_BASE_URL: {{ .Values.config.callbackBaseUrl }}
  AI_BASE_URL: {{ .Values.config.aiBaseUrl }}
{{- if .Values.config.milvusEnabled }}
  # RAG 向量检索（可选）：Milvus 接入，需先部署 k8s/milvus
  MILVUS_ENABLED: "true"
  MILVUS_HOST: {{ .Values.config.milvusHost }}
  MILVUS_PORT: {{ .Values.config.milvusPort }}
  MILVUS_DATABASE: {{ .Values.config.milvusDatabase }}
  MILVUS_EMBEDDING_ENDPOINT: {{ .Values.config.milvusEmbeddingEndpoint }}
  MILVUS_EMBEDDING_API_KEY: {{ .Values.config.milvusEmbeddingApiKey }}
  MILVUS_EMBEDDING_MODEL: {{ .Values.config.milvusEmbeddingModel }}
{{- end }}
  # 生产配置层必需项：缺失会导致后端启动失败（fail-fast）
  FRONTEND_URL: {{ .Values.config.frontendUrl }}
  CORS_ALLOWED_ORIGIN_PATTERNS: {{ .Values.config.corsAllowedOriginPatterns }}
  # 上传持久化挂载点：本地存储 root + /uploads 静态资源根（P2-15 高可用）
  UPLOAD_PATH: {{ .Values.storage.uploadPath }}
{{- if .Values.config.redisSentinelMaster }}
  # Redis 主从哨兵（可选）：仅当 master 非空时注入，避免空值误激活后端哨兵段（application-prod.yml on-property）
  REDIS_SENTINEL_MASTER: {{ .Values.config.redisSentinelMaster }}
  REDIS_SENTINEL_NODES: {{ .Values.config.redisSentinelNodes }}
  REDIS_SENTINEL_PASSWORD: {{ .Values.config.redisSentinelPassword }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secret.dbPassword }}
  JWT_SECRET: {{ .Values.secret.jwtSecret }}
  TOTP_ENCRYPTION_KEY: {{ .Values.secret.totpEncryptionKey }}
  AUTH_TOKEN: {{ .Values.secret.aiAuthToken }}
  MCP_AUTH_TOKEN: {{ .Values.secret.mcpAuthToken }}
{{- if .Values.storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-upload
spec:
  accessModes:
    - {{ .Values.storage.accessMode }}
  {{- with .Values.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.replicas.backend }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      automountServiceAccountToken: false
      # 优雅停机宽限期 > 后端 prod 关闭超时（30s），排空在途请求再销毁
      terminationGracePeriodSeconds: {{ .Values.storage.terminationGracePeriodSeconds }}
      # 多副本打散到不同节点，避免单节点故障拖垮全部实例（P2-15 高可用）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-backend
      {{- if .Values.storage.enabled }}
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-upload
      {{- end }}
      containers:
        - name: backend
          image: {{ .Values.images.backend }}
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.backend | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          {{- if .Values.storage.enabled }}
          volumeMounts:
            - name: upload
              mountPath: {{ .Values.storage.uploadPath }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          env:
            - name: SPRING_PROFILES_ACTIVE
              # 强制生产配置层：加载 application-prod.yml，JwtProperties/TotpService
              # 在非 dev 下拒绝开发默认密钥，未注入密钥直接启动失败
              value: "prod"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ai
spec:
  replicas: {{ .Values.replicas.ai }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ai
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ai
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.storage.terminationGracePeriodSeconds }}
      # 多副本打散到不同节点（P2-15 高可用）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-ai
      containers:
        - name: ai
          image: {{ .Values.images.ai }}
          ports:
            - containerPort: 8000
          securityContext:
            {{- toYaml .Values.securityContext.ai | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.ai | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.frontend | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-website
spec:
  replicas: {{ .Values.replicas.website }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-website
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-website
    spec:
      automountServiceAccountToken: false
      containers:
        - name: website
          image: {{ .Values.images.website }}
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.website | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.website | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ai
spec:
  selector:
    app: {{ .Release.Name }}-ai
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  selector:
    app: {{ .Release.Name }}-frontend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-website
spec:
  selector:
    app: {{ .Release.Name }}-website
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
            type: Utilization
            averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-ai
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-website
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-website
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ai
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-website
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-website
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API/SSE 直达后端，避免经前端 nginx 二次转发
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: 8080
          # 文件内容（inline 预览，contentUrl=/files/xxx）同源直达后端
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: 8080

