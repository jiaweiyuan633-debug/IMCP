{{- /* 密钥治理：缺省/空值即终止渲染（fail-fast），杜绝明文默认密钥上生产。
     设置 secret.existingSecret 时跳过校验（外部 Secret 由 ESO/手工提供） */ -}}
{{- if and (not .Values.secret.existingSecret) (or (not .Values.secret.dbPassword) (not .Values.secret.jwtSecret) (not .Values.secret.totpEncryptionKey) (not .Values.secret.aiAuthToken) (not .Values.secret.mcpAuthToken)) }}
{{ fail "secret.dbPassword / secret.jwtSecret / secret.totpEncryptionKey / secret.aiAuthToken / secret.mcpAuthToken 必须通过 --set 显式注入（例如 --set secret.dbPassword=xxx --set secret.jwtSecret=xxx --set secret.totpEncryptionKey=xxx --set secret.aiAuthToken=xxx --set secret.mcpAuthToken=xxx），或设置 secret.existingSecret 引用外部 Secret" }}
{{- end }}
{{- /* TLS 治理：ingress.tls 默认开启（values.yaml）。enabled=true 而 clusterIssuer 为空时
     cert-manager 不会签发证书，Ingress 却已按 TLS 声明流量——fail-fast 终止渲染，
     部署方必须显式提供 issuer，或显式置 enabled=false 关闭 TLS。 */ -}}
{{- if and .Values.ingress.tls.enabled (not .Values.ingress.tls.clusterIssuer) }}
{{ fail "ingress.tls.enabled=true 时必须提供 ingress.tls.clusterIssuer（cert-manager ClusterIssuer 名称，如 --set ingress.tls.clusterIssuer=letsencrypt-prod）；不需要 TLS 时显式 --set ingress.tls.enabled=false" }}
{{- end }}
{{- /*
    内部服务主机名：values.config.{callbackBaseUrl,aiBaseUrl,frontendUrl} 留空时按
    .Release.Name 推导（{release}-backend / -ai / -frontend），与下方各 Service
    命名保持一致。values.yaml 不再硬编码 admin-* 默认值，避免非默认 release 名下回调/出站
    AI/前端地址漂移指向不存在的服务。
*/ -}}
{{- $callbackBaseUrl := .Values.config.callbackBaseUrl | default (printf "http://%s-backend:8080" .Release.Name) -}}
{{- $aiBaseUrl := .Values.config.aiBaseUrl | default (printf "http://%s-ai:8000" .Release.Name) -}}
{{- $frontendUrl := .Values.config.frontendUrl | default (printf "http://%s-frontend:8080" .Release.Name) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  DB_HOST: {{ .Values.config.dbHost }}
  DB_PORT: {{ .Values.config.dbPort }}
  DB_NAME: {{ .Values.config.dbName }}
  DB_USERNAME: {{ .Values.config.dbUser }}
  REDIS_HOST: {{ .Values.config.redisHost }}
  REDIS_PORT: {{ .Values.config.redisPort }}
  REDIS_URL: {{ .Values.config.redisUrl }}
  CALLBACK_BASE_URL: {{ $callbackBaseUrl }}
  # AI 回调 SSRF 防护白名单：由 callbackBaseUrl 推导（避免手工同步漂移）。
  # AI 服务出站任务回调仅允许打回后端回调 origin；如需多 origin 改此模板为静态 JSON 数组。
  CALLBACK_ALLOWED_ORIGINS: {{ list $callbackBaseUrl | toJson | quote }}
  AI_BASE_URL: {{ $aiBaseUrl }}
{{- if .Values.config.milvusEnabled }}
  # RAG 向量检索（可选）：Milvus 接入，需先部署 k8s/milvus
  MILVUS_ENABLED: "true"
  MILVUS_HOST: {{ .Values.config.milvusHost }}
  MILVUS_PORT: {{ .Values.config.milvusPort }}
  MILVUS_DATABASE: {{ .Values.config.milvusDatabase }}
  MILVUS_EMBEDDING_ENDPOINT: {{ .Values.config.milvusEmbeddingEndpoint }}
  MILVUS_EMBEDDING_API_KEY: {{ .Values.config.milvusEmbeddingApiKey }}
  MILVUS_EMBEDDING_MODEL: {{ .Values.config.milvusEmbeddingModel }}
{{- end }}
  # 生产配置层必需项：缺失会导致后端启动失败（fail-fast）
  FRONTEND_URL: {{ $frontendUrl }}
  CORS_ALLOWED_ORIGIN_PATTERNS: {{ .Values.config.corsAllowedOriginPatterns }}
  # 上传持久化挂载点：本地存储 root + /uploads 静态资源根
  UPLOAD_PATH: {{ .Values.storage.uploadPath }}
{{- if .Values.config.redisSentinelMaster }}
  # Redis 主从哨兵（可选）：仅当 master 非空时注入，避免空值误激活后端哨兵段（application-prod.yml on-property）
  REDIS_SENTINEL_MASTER: {{ .Values.config.redisSentinelMaster }}
  REDIS_SENTINEL_NODES: {{ .Values.config.redisSentinelNodes }}
  REDIS_SENTINEL_PASSWORD: {{ .Values.config.redisSentinelPassword }}
{{- end }}
  # 链路追踪（可选）：配置了端点才启用；留空显式关闭 tracing，避免空 endpoint 下
  # Sender/AsyncZipkinSpanHandler 仍被实例化、每次 flush 构造非法 URI 失败丢 span
  # （management.tracing.enabled=false 使 spanHandler 不注册，application.yml 同名属性）
  MANAGEMENT_TRACING_ENABLED: {{ if .Values.config.zipkinEndpoint }}true{{ else }}false{{ end }}
  {{- if .Values.config.zipkinEndpoint }}
  # Zipkin 上报端点，与 MANAGEMENT_TRACING_ENABLED 配套（application.yml management.zipkin.tracing.endpoint）
  ZIPKIN_ENDPOINT: {{ .Values.config.zipkinEndpoint }}
  {{- end }}
  # AI 服务生产配置：此前无 LLM_PROVIDERS/WORKER_COUNT 注入通道，
  # K8s 下 AI 服务永远以 mock 提供方运行（16 维 mock 向量、检索失真且无报错）。
  # llmProviders 留空时注入空串 → ai-service 保持 mock 默认（dev 语义）；配置时
  # LLM_PROVIDERS 由模板注入（含 API Key，仅经 Secret 透出更安全，见 aiLlmApiKeys）
  LLM_PROVIDERS: {{ .Values.config.aiLlmProviders | quote }}
  WORKER_COUNT: {{ .Values.config.aiWorkerCount }}
  OCR_PROVIDER: {{ .Values.config.aiOcrProvider }}
  OCR_FAIL_FAST: {{ .Values.config.aiOcrFailFast }}
{{- if not .Values.secret.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secret.dbPassword }}
  JWT_SECRET: {{ .Values.secret.jwtSecret }}
  TOTP_ENCRYPTION_KEY: {{ .Values.secret.totpEncryptionKey }}
  AUTH_TOKEN: {{ .Values.secret.aiAuthToken }}
  MCP_AUTH_TOKEN: {{ .Values.secret.mcpAuthToken }}
  {{- if .Values.secret.aiLlmApiKeys }}
  # AI 服务 LLM 供应商 API Key：模板将 LLM_PROVIDERS 拆分为「provider 配置 + api_key
  # 占位符」时经 Secret 注入；简单场景可直接把 key 内联进 config.aiLlmProviders JSON
  AI_LLM_API_KEYS: {{ .Values.secret.aiLlmApiKeys }}
  {{- end }}
{{- end }}
{{- if .Values.storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-upload
spec:
  accessModes:
    - {{ .Values.storage.accessMode }}
  {{- with .Values.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.replicas.backend }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 优雅停机宽限期 > 后端 prod 关闭超时（30s），排空在途请求再销毁
      terminationGracePeriodSeconds: {{ .Values.storage.terminationGracePeriodSeconds }}
      # 多副本打散到不同节点，避免单节点故障拖垮全部实例
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-backend
      {{- if .Values.storage.enabled }}
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-upload
      {{- end }}
      containers:
        - name: backend
          image: {{ .Values.images.backend }}
          # 不可变 tag（见 values.yaml images，默认禁 latest）：显式 IfNotPresent，
          # 避免依赖 K8s 按 tag 的隐式拉取语义（仅 latest 才默认 Always）
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.backend | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          {{- if .Values.storage.enabled }}
          volumeMounts:
            - name: upload
              mountPath: {{ .Values.storage.uploadPath }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          env:
            - name: SPRING_PROFILES_ACTIVE
              # 强制生产配置层：加载 application-prod.yml，JwtProperties/TotpService
              # 在非 dev 下拒绝开发默认密钥，未注入密钥直接启动失败
              value: "prod"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                # existingSecret 时引用外部 Secret（ESO/手工），否则用 Chart 自建
                name: {{ .Values.secret.existingSecret | default (printf "%s-secret" .Release.Name) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ai
spec:
  replicas: {{ .Values.replicas.ai }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ai
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ai
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.storage.terminationGracePeriodSeconds }}
      # 多副本打散到不同节点
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-ai
      containers:
        - name: ai
          image: {{ .Values.images.ai }}
          # 不可变 tag（见 values.yaml images，默认禁 latest）：显式 IfNotPresent，
          # 避免依赖 K8s 按 tag 的隐式拉取语义（仅 latest 才默认 Always）
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            {{- toYaml .Values.securityContext.ai | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.ai | nindent 12 }}
          readinessProbe:
            httpGet:
              # readiness 打 /readyz（依赖 Redis，就绪语义）
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              # liveness 打 /livez（纯进程存活，恒 200）——原共用 /health 依赖
              # Redis，Redis 抖动时所有副本 CrashLoopBackOff
              path: /livez
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.secret.existingSecret | default (printf "%s-secret" .Release.Name) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          # 不可变 tag（见 values.yaml images，默认禁 latest）：显式 IfNotPresent，
          # 避免依赖 K8s 按 tag 的隐式拉取语义（仅 latest 才默认 Always）
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.frontend | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-website
spec:
  replicas: {{ .Values.replicas.website }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-website
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-website
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: website
          image: {{ .Values.images.website }}
          # 不可变 tag（见 values.yaml images，默认禁 latest）：显式 IfNotPresent，
          # 避免依赖 K8s 按 tag 的隐式拉取语义（仅 latest 才默认 Always）
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext.website | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.website | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ai
spec:
  selector:
    app: {{ .Release.Name }}-ai
  ports:
    - port: 8000
      targetPort: 8000
