apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
---
# AI 服务入站：仅允许 backend 调用（提交/查询任务），
# 避免 default-deny 策略误杀 AI 的入站流量
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ai
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-backend
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        # 与 nginx 实际监听端口一致（frontend/nginx.conf listen 8080）；default-deny 下端口不符会阻断前端
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-website
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-website
  policyTypes:
    - Ingress
  ingress:
    - ports:
        # 与 nginx 实际监听端口一致（website/nginx.conf listen 8080）
        - port: 8080
