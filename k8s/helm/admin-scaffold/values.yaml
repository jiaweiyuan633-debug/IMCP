images:
  backend: admin-backend:latest
  ai: ai-service:latest
  frontend: frontend:latest
  website: website:latest

replicas:
  backend: 2
  ai: 2
  frontend: 2
  website: 2

resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  ai:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  website:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

securityContext:
  backend:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  ai:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  frontend:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  website:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

config:
  dbHost: mysql
  dbPort: "3306"
  dbName: admin_scaffold
  dbUser: root
  redisHost: redis
  redisPort: "6379"
  callbackBaseUrl: http://admin-backend:8080
  aiBaseUrl: http://ai-service:8000

secret:
  dbPassword: root123456
  jwtSecret: change-me

ingress:
  host: admin.example.com

