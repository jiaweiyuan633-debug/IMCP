images:
  backend: admin-backend:latest
  ai: ai-service:latest
  frontend: frontend:latest
  website: website:latest

replicas:
  backend: 2
  ai: 2
  frontend: 2
  website: 2

resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  ai:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  website:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

securityContext:
  backend:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  ai:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  frontend:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  website:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

config:
  dbHost: mysql
  dbPort: "3306"
  dbName: admin_scaffold
  dbUser: root
  redisHost: redis
  redisPort: "6379"
  redisUrl: redis://redis:6379/0
  callbackBaseUrl: http://admin-backend:8080
  aiBaseUrl: http://ai-service:8000
  # 生产必须显式注入，否则后端生产配置层（application-prod.yml）启动失败（fail-fast）
  frontendUrl: http://admin-frontend:8080
  corsAllowedOriginPatterns: https://admin.example.com

# 密钥一律不留默认值：部署时必须通过 --set secret.*=... 显式注入，
# 留空或未注入时 all.yaml 顶部 fail 校验将终止渲染，杜绝明文默认密钥上生产。
secret:
  dbPassword: ""
  jwtSecret: ""
  totpEncryptionKey: ""
  # AI 服务鉴权密钥：与后端 AiServiceConfig.apiKey 保持一致（入站任务鉴权 + 回调 HMAC 签名）
  aiAuthToken: ""
  # MCP Server 端点鉴权令牌：Claude Desktop 等外部客户端连接 /mcp 时以 Authorization: Bearer 携带
  mcpAuthToken: ""

ingress:
  host: admin.example.com

