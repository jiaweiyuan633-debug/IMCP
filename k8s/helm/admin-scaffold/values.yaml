images:
  backend: admin-backend:latest
  ai: ai-service:latest
  frontend: frontend:latest
  website: website:latest

replicas:
  backend: 2
  ai: 2
  frontend: 2
  website: 2

resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  ai:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  website:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

securityContext:
  backend:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  ai:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  frontend:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  website:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

config:
  dbHost: mysql
  dbPort: "3306"
  dbName: admin_scaffold
  dbUser: root
  redisHost: redis
  redisPort: "6379"
  redisUrl: redis://redis:6379/0
  callbackBaseUrl: http://admin-backend:8080
  aiBaseUrl: http://ai-service:8000
  # RAG 向量检索（可选）：false 走 MySQL ngram 全文检索（零依赖）；true 需先部署 k8s/milvus
  milvusEnabled: false
  milvusHost: milvus
  milvusPort: "19530"
  milvusDatabase: default
  # OpenAI 兼容 /embeddings 端点：指向 ai-service 的 /api/v1/embeddings；留空则用本地哈希向量
  milvusEmbeddingEndpoint: ""
  milvusEmbeddingApiKey: ""
  milvusEmbeddingModel: text-embedding-3-small
  # 生产必须显式注入，否则后端生产配置层（application-prod.yml）启动失败（fail-fast）
  frontendUrl: http://admin-frontend:8080
  corsAllowedOriginPatterns: https://admin.example.com
  # 可选：Redis 主从哨兵高可用。不设（留空）则后端走 redisHost/redisPort 单实例；
  # 设置 master 时后端自动切换为哨兵拓扑（application-prod.yml on-property 激活）。
  # 空值时模板不注入 REDIS_SENTINEL_MASTER，避免空字符串误激活哨兵段。
  redisSentinelMaster: ""
  # 逗号分隔哨兵节点：host1:26379,host2:26379，与 master 成对设置
  redisSentinelNodes: ""
  # 哨兵节点自身认证口令（可选）
  redisSentinelPassword: ""

# 上传文件持久化：本地存储（app.storage.type=local，默认）多副本必须共享同一存储卷，
# 否则文件散落在各 Pod 本地盘且 Pod 重建即丢。多副本需 ReadWriteMany（RWX）存储类。
storage:
  enabled: true
  className: ""
  accessMode: ReadWriteMany
  size: 10Gi
  # 后端上传目录（挂载点），同时作为 /uploads 静态资源根目录
  uploadPath: /data/uploads
  # 优雅停机宽限期（秒）：> 后端关闭超时（prod 配置 30s），留出在途请求排空时间
  terminationGracePeriodSeconds: 60

# 密钥一律不留默认值：部署时必须通过 --set secret.*=... 显式注入，
# 留空或未注入时 all.yaml 顶部 fail 校验将终止渲染，杜绝明文默认密钥上生产。
secret:
  dbPassword: ""
  jwtSecret: ""
  totpEncryptionKey: ""
  # AI 服务鉴权密钥：与后端 AiServiceConfig.apiKey 保持一致（入站任务鉴权 + 回调 HMAC 签名）
  aiAuthToken: ""
  # MCP Server 端点鉴权令牌：Claude Desktop 等外部客户端连接 /mcp 时以 Authorization: Bearer 携带
  mcpAuthToken: ""

ingress:
  host: admin.example.com

