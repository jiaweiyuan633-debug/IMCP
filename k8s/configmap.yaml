apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: admin_scaffold
  DB_USERNAME: root
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379/0
  CALLBACK_BASE_URL: http://admin-backend:8080
  AI_BASE_URL: http://ai-service:8000
  # 生产配置层必需项：缺失会导致后端启动失败（fail-fast）
  FRONTEND_URL: http://admin-frontend:8080
  CORS_ALLOWED_ORIGIN_PATTERNS: https://admin.example.com

