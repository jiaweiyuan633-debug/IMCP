# 测试/联调配置层：由 SPRING_PROFILES_ACTIVE=test 激活（application.yml 默认 prod，本地开发须显式注入 dev/test）
#
# 定位：介于 dev 与 prod 之间的联调 / QA / CI 集成测试环境。
#
# 设计原则：
# 1. 数据源指向独立 test 实例（默认库名 admin_scaffold_test），与本地开发库隔离。
# 2. 密钥仍然 fail-fast：非 dev profile 下 JwtProperties / TotpService / McpAuthFilter
#    会拒绝 dev 默认密钥与兜底令牌，因此此处不提供明文默认，必须由 CI / 部署注入
#    （与 prod 同规，杜绝测试环境明文密钥泄露）。
# 3. 保留接口文档、健康详情与全量采样（与 prod 的关键差异），便于前后端联调与问题定位。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:admin_scaffold_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 测试库可整体重建，允许对空库自动打基线（与 prod 的 baseline-on-migrate=false 区分）
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      show-details: always

# 非 dev 一律不设明文默认：缺失即 placeholder 解析失败 / JwtProperties 校验抛异常启动失败（fail-fast）
jwt:
  secret: ${JWT_SECRET}

app:
  totp:
    encryption-key: ${TOTP_ENCRYPTION_KEY}
  mcp:
    # 非 dev 不设默认：缺失时 McpAuthFilter fail-closed 拒绝一切 MCP 连接
    auth-token: ${MCP_AUTH_TOKEN}
  security:
    # 测试/联调环境同样关闭默认口令强制改密（CI e2e/smoke 依赖 admin/admin123）
    force-password-change: ${FORCE_PASSWORD_CHANGE:false}
