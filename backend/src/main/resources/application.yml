server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: admin-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:admin-scaffold-jwt-secret-key-2026-change-me-in-production}
  access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
  refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}

knife4j:
  enable: true
