server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: admin-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.scheduler.instanceName: adminScheduler
      org.quartz.jobStore.isClustered: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{40} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:admin-scaffold-jwt-secret-key-2026-change-me-in-production}
  access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
  refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}

app:
  callback-base-url: ${CALLBACK_BASE_URL:http://127.0.0.1:8080}
  ai-base-url: ${AI_BASE_URL:}
  upload-path: ${UPLOAD_PATH:uploads}
  sql-log-threshold-ms: ${SQL_LOG_THRESHOLD_MS:50}
  ai:
    scan-interval-ms: ${AI_SCAN_INTERVAL_MS:30000}

knife4j:
  enable: true
