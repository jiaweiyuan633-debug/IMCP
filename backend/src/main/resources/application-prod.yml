# 生产配置层：由 SPRING_PROFILES_ACTIVE=prod 激活（application.yml 默认 dev，生产必须显式注入环境变量）
#
# 设计原则：
# 1. 密钥/口令一律不提供默认值 —— 缺失即 placeholder 解析失败，应用启动直接失败（fail-fast），
#    绝不允许静默回落 dev 明文兜底（JwtProperties / TotpService 会在非 dev 下拒绝开发默认密钥）。
# 2. 关闭接口文档与信息泄露面：springdoc / knife4j / health 详情。
# 3. 采样率降为 0.1（P1-10 可观测性），默认值即可，环境变量可覆盖。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产严禁对非空库自动打基线：迁移一致性由 validate-on-migrate（Flyway 默认开启）保障
    baseline-on-migrate: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  endpoint:
    health:
      show-details: never

app:
  callback-base-url: ${CALLBACK_BASE_URL}
  frontend-url: ${FRONTEND_URL}
  mcp:
    # 生产不设默认：缺失时 placeholder 解析失败启动即失败；非 dev 下等于 dev 默认值时 MCP 拒绝连接
    auth-token: ${MCP_AUTH_TOKEN}
  upload-path: ${UPLOAD_PATH:uploads}
  storage:
    type: ${STORAGE_TYPE:local}
  cors:
    # 生产无默认来源：必须通过 CORS_ALLOWED_ORIGIN_PATTERNS 显式配置前端域名，缺省即拒绝跨域
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  totp:
    # 生产不设默认：缺失或等于 dev 兜底密钥时 TotpService 构造器将抛异常
    encryption-key: ${TOTP_ENCRYPTION_KEY}

jwt:
  # 生产不设默认：缺失、等于 dev/占位密钥或长度不足时 JwtProperties 校验将抛异常
  secret: ${JWT_SECRET}
