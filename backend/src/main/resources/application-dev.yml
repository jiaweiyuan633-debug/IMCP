spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:admin_scaffold}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redisson 3.30 缺陷:对空字符串 password 也会发送 AUTH "",本机无密码 Redis 会拒绝连接 → 启动失败。
      # 故默认不配置 password(属性缺失 = null = Redisson 跳过 AUTH)。
      # 若 Redis 需要密码认证:取消注释下行,通过环境变量 REDIS_PASSWORD 注入。
      # password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 仅限本地开发的默认密钥，生产必须通过环境变量 JWT_SECRET / TOTP_ENCRYPTION_KEY 覆盖
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-please-override-0123456789abcdef}

app:
  totp:
    encryption-key: ${TOTP_ENCRYPTION_KEY:dev-only-totp-encryption-key-please-override}
  security:
    # 本地开发关闭默认口令强制改密：保持 admin/admin123 可直接登录（e2e/smoke/load-test 依赖），
    # 生产由 application-prod.yml 强制开启（V63 迁移标记在 dev 下不生效）
    force-password-change: ${FORCE_PASSWORD_CHANGE:false}

