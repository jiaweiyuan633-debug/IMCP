spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:admin_scaffold}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 仅限本地开发的默认密钥，生产必须通过环境变量 JWT_SECRET / TOTP_ENCRYPTION_KEY 覆盖
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-please-override-0123456789abcdef}

app:
  totp:
    encryption-key: ${TOTP_ENCRYPTION_KEY:dev-only-totp-encryption-key-please-override}

