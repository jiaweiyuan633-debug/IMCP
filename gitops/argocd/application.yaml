apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-scaffold
  namespace: argocd
spec:
  project: default
  source:
    # TODO: 替换为实际私有 Git 仓库地址（Helm Chart 唯一来源，勿与原生清单混用）
    repoURL: https://github.com/your-org/admin-scaffold.git
    targetRevision: main
    path: k8s/helm/admin-scaffold
    helm:
      valueFiles:
        - ../../../gitops/argocd/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: admin-scaffold
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
