apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: y15-admin-scaffold
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jiaweiyuan633-debug/Y15-framework.git
    targetRevision: main
    path: k8s/helm/admin-scaffold
    helm:
      valueFiles:
        - ../../../gitops/argocd/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: admin-scaffold
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
