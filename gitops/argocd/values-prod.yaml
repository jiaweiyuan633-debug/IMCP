images:
  backend: registry.example.com/admin-backend:1.0.0
  ai: registry.example.com/ai-service:1.0.0
  frontend: registry.example.com/admin-frontend:1.0.0
  website: registry.example.com/website:1.0.0

config:
  dbHost: mysql.example.internal
  dbPort: "3306"
  dbName: admin_scaffold
  dbUser: admin
  redisHost: redis.example.internal
  redisPort: "6379"
  callbackBaseUrl: http://admin-backend:8080
  aiBaseUrl: http://ai-service:8000

# 生产密钥禁止明文入仓：必须由部署时注入（ArgoCD helm.parameters / External Secrets Operator / Vault / Sealed Secrets）。
# 留空（或未注入）时 Helm 模板将 fail-fast，ArgoCD 同步会失败，直至密钥注入完成。
secret:
  dbPassword: ""
  jwtSecret: ""
  totpEncryptionKey: ""
  aiAuthToken: ""
  mcpAuthToken: ""

ingress:
  host: admin.example.com
