# 官网静态站点 nginx 配置（nginx-unprivileged 监听 8080，对外由网关/Ingress 暴露）
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 安全响应头（纵深，官网为公网入口）：点击劫持/MIME 嗅探/信息泄漏/iframe 与对象加载收紧
    # - CSP：default-src 'self'；style-src 保留 'unsafe-inline'（cssinjs/运行时内联 <style> 需要）；
    #   img-src 放开 data:/blob:（内联背景/预览）。官网无 API/WS 调用，connect-src 'self' 即够；
    #   若后续启用跨源线索端点或第三方埋点（VITE_GA_ID/VITE_GTM_ID），需在此追加对应域名
    #   （script-src/connect-src 加 https://www.googletagmanager.com https://www.google-analytics.com）。
    # - HSTS 无条件下发：TLS 在网关/Ingress 终结，浏览器只在 https 响应采纳该头，
    #   直连 http（本地开发/未上 TLS）时按规范忽略，故无需 $https 分支。
    # 注意：nginx add_header 不跨层继承——下方带 add_header 的 location 必须重复这组头，
    # 否则该 location 的响应会丢失 server 层安全头。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA 路由回退（首屏与刷新均回落到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存；该 location 自带 add_header，需重复 server 层安全头
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
}
