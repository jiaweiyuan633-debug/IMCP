services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: admin_scaffold
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: admin_scaffold
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      CALLBACK_BASE_URL: http://backend:8080
      AI_BASE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-admin-scaffold-jwt-secret-key-2026-change-me-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/Dockerfile.ai
    environment:
      REDIS_URL: redis://redis:6379/0
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-dev-ai-service-token}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${AI_PORT:-8000}:8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

  website:
    build:
      context: ..
      dockerfile: docker/Dockerfile.website
    ports:
      - "${WEBSITE_PORT:-8081}:80"

volumes:
  mysql-data:
  redis-data:

