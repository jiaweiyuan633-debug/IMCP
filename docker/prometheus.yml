global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: admin-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: ai-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - ai-service:8000
