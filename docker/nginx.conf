# 本地 Docker 栈前端代理配置（挂载覆盖镜像内默认配置，不参与 K8s 部署）
# K8s 由 Ingress 把 /api、/files、/ws 直达后端；本地无 Ingress，这里把 /api、/uploads、/files、/ws
# 反代到 backend，路径集合与 k8s/helm Ingress 保持一致并额外补 /uploads 静态根
# （后端 WebMvcConfig 映射本地存储）。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 上传请求体上限：后端允许 20MB，nginx 默认 1MB 会 413
    client_max_body_size 20m;

    # 安全响应头（纵深）：点击劫持/MIME 嗅探/信息泄漏/iframe 与对象加载收紧。
    # CSP 面向管理端 SPA：API/WS 均同源（/api、/ws、/uploads、/files 反代到 backend），
    # connect-src 'self' 即可；style-src 保留 'unsafe-inline'（antd cssinjs / Vue 运行时内联
    # <style> 依赖）。启用跨源 API 或第三方上报时需在此追加域名。
    # HSTS 无条件下发：浏览器只在 https 响应采纳（本地 http 直连按规范忽略）。
    # 注意：nginx add_header 不跨层继承——凡自带 add_header 的 location 需重复整组头；
    # 下方反代 location 无 add_header，自动继承 server 层头。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 后端 API 反代；关闭缓冲以支持 SSE 通知
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 上传文件（后端本地存储 /uploads/**，FileAccessFilter 校验 ?token=）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 受令牌保护的文件内容（contentUrl=/files/{id}，前端拼 ?token= 访问，FileAccessFilter 校验）。
    # 此前缺失导致本地栈 /files/xxx 落入下方 SPA 回退返回 index.html——图片/附件全挂，
    # 头像、文件管理预览、下载在本地 Docker 部署不可用；与 K8s Ingress /files 直达后端对齐。
    location /files/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 站内消息 WebSocket 反代（Upgrade/Connection 头）——此前缺失，
    # /ws/messages 落入下方 location / 返回 index.html，WS 握手必然失败
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # /favicon.ico：浏览器未配置图标链接时的自动请求，返回 SVG 图标避免 404
    location = /favicon.ico {
        default_type image/svg+xml;
        try_files /favicon.svg =404;
    }

    # index.html 与 sw.js 不缓存——浏览器启发式缓存可能复用旧壳，
    # 配合 PWA 发版拿旧版本（旧前端调用已下线接口）；自带 add_header，重复 server 层安全头
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存（自带 add_header，重复 server 层安全头）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
}
