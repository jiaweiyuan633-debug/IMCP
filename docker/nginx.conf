# 本地 Docker 栈前端代理配置（挂载覆盖镜像内默认配置，不参与 K8s 部署）
# K8s 由 Ingress 把 /api、/files 直达后端；本地无 Ingress，这里把 /api、/uploads、/files 反代到 backend，
# 路径集合与 k8s/helm Ingress（/api + /files）保持一致并额外补 /uploads 静态根（后端 WebMvcConfig 映射本地存储）。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API 反代；关闭缓冲以支持 SSE 通知
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 上传文件（后端本地存储 /uploads/**，FileAccessFilter 校验 ?token=）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 受令牌保护的文件内容（contentUrl=/files/{id}，前端拼 ?token= 访问，FileAccessFilter 校验）。
    # R4-1.41：此前缺失导致本地栈 /files/xxx 落入下方 SPA 回退返回 index.html——图片/附件全挂，
    # 头像、文件管理预览、下载在本地 Docker 部署不可用；与 K8s Ingress /files 直达后端对齐。
    location /files/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
